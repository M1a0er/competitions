<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>竞赛列表</title>
  <style>
    :root {
      --accent: #a41f1b;
      --bg: #faf9f7;
      --text: #111;
      --text_y: #968172;
      --border: rgba(164, 31, 27, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "NSimSun", "SimSun", "Songti SC", "Microsoft YaHei", serif;
      overflow-x: hidden;
      position: relative;
      padding: 36px 24px 80px;
    }

    /* 背景装饰线 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      left: -80px;
      width: 320px;
      height: 2px;
      background: var(--accent);
      transform-origin: left center;
      z-index: 0;
      opacity: 0.6;
    }
    body::before { top: 40px; transform: rotate(-45deg); }
    body::after  { bottom: 40px; transform: rotate(45deg); }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(960px, 100%);
      margin: 0 auto;
    }

    /* 动画 */
    @keyframes riseFade {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-item {
      opacity: 0;
      animation: riseFade 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-logo    { animation-delay: 0.05s; }
    .anim-divider { animation-delay: 0.12s; }
    .anim-dept    { animation-delay: 0.20s; }
    .anim-h1      { animation-delay: 0.28s; }
    .anim-sub     { animation-delay: 0.34s; }
    .anim-cards   { animation-delay: 0.42s; }
    .anim-footer  { animation-delay: 0.50s; }

    /* 头部 */
    .header { text-align: center; margin-bottom: 8px; }

    .logo {
      width: 90px; height: auto; display: block;
      margin: 0 auto 2px; object-fit: contain;
    }

    .divider {
      width: 100%; max-width: 420px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; color: var(--accent);
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 2px; background: currentColor;
    }
    .divider .square {
      width: 12px; height: 12px; background: currentColor;
      transform: rotate(45deg); flex-shrink: 0;
    }

    .dept {
      font-size: 17px; font-weight: 700; margin: 6px 0 28px;
      text-align: center;
    }

    .title-block { text-align: center; margin-bottom: 4px; }
    .title {
      font-size: 44px; font-weight: bolder; letter-spacing: 3px;
      margin: 0; line-height: 1.2; color: var(--accent);
    }
    .title-en {
      margin-top: 4px; font-size: 14px; letter-spacing: 1px; color: var(--text_y);
    }

    /* 搜索框 */
    .search-wrap {
      display: flex; justify-content: center; margin: 20px 0 0;
    }
    .search-input {
      width: min(360px, 100%);
      padding: 10px 16px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(164, 31, 27, 0.08);
    }
    .search-input::placeholder {
      color: var(--text_y);
    }

    /* 筛选栏 */
    .filter-row {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 14px; margin: 12px 0 0;
    }

    .filter-select {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s;
      letter-spacing: 1px;
    }
    .filter-select:focus {
      border-color: var(--accent);
    }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
      color: var(--text_y);
      font-size: 15px;
    }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .card {
      display: block;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px 14px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(164, 31, 27, 0.10);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-num {
      width: 32px; height: 32px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .card-name {
      font-size: 15px; font-weight: 700; line-height: 1.4;
      color: #222;
      flex: 1;
    }

    .card-tags {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px;
    }

    .tag-a {
      display: inline-flex; align-items: center;
      height: 20px;
      background: var(--accent);
      color: #fff;
      padding: 0 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
      vertical-align: middle;
    }

    .tag-level {
      display: inline-flex; align-items: center;
      height: 20px;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
      vertical-align: middle;
    }

    .tag-cat {
      display: inline-flex; align-items: center;
      height: 20px;
      background: rgba(164, 31, 27, 0.06);
      color: var(--text_y);
      padding: 0 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
      vertical-align: middle;
    }

    .tag-legend {
      background: linear-gradient(135deg, #b8860b, #daa520);
      color: #fff;
      box-shadow: 0 0 8px rgba(218, 165, 32, 0.5), 0 0 16px rgba(218, 165, 32, 0.2);
    }

    .tag-epic {
      background: linear-gradient(135deg, #7b2d8b, #b44dc9);
      color: #fff;
      box-shadow: 0 0 8px rgba(180, 77, 201, 0.5), 0 0 16px rgba(180, 77, 201, 0.2);
    }

    .tag-rare {
      background: linear-gradient(135deg, #1b8b2d, #3dc95a);
      color: #fff;
      box-shadow: 0 0 8px rgba(61, 201, 90, 0.5), 0 0 16px rgba(61, 201, 90, 0.2);
    }

    .tag-night {
      background: linear-gradient(135deg, #0d1b3e, #1c3a6b);
      color: #c8daf5;
      box-shadow: 0 0 8px rgba(28, 58, 107, 0.5), 0 0 16px rgba(28, 58, 107, 0.2);
    }

    .tag-done {
      background: #8a8a8a;
      color: #fff;
    }

    .card-bars {
      display: flex; flex-direction: column; gap: 4px;
    }

    .card-bar-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px;
    }

    .card-bar-label {
      width: 28px; text-align: right; font-weight: 700;
      color: var(--accent); flex-shrink: 0;
    }

    .card-bar-wrap {
      flex: 1; height: 5px;
      background: rgba(164, 31, 27, 0.07);
      border-radius: 3px; overflow: hidden;
    }

    .card-bar-fill {
      height: 100%; background: var(--accent); border-radius: 3px;
    }

    .card-bar-val {
      width: 16px; text-align: center; color: var(--text_y);
      flex-shrink: 0;
    }

    /* 底部 */
    .footer-line {
      width: 100%; max-width: 420px; margin: 40px auto 0;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; color: var(--accent);
    }
    .footer-line::before, .footer-line::after {
      content: ""; flex: 1; height: 2px; background: currentColor;
    }
    .footer-year {
      font-size: 14px; font-weight: 700; color: var(--accent);
      margin: 0 4px; letter-spacing: 2px;
    }

    .back-link {
      display: inline-block; margin-top: 14px;
      padding: 10px 24px; border-radius: 999px;
      background: var(--accent); color: #fff;
      text-decoration: none; font-size: 16px; font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(164, 31, 27, 0.2);
      transition: transform 0.2s ease;
    }
    .back-link:hover { transform: translateY(-2px); }

    @media (max-width: 640px) {
      .title { font-size: 30px; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

      var id = c[0], name = c[1], diff = c[2], heat = c[3], juan = c[4], level = c[5], cls = c[6], cats = c[7];
      var numStr = id < 10 ? '0' + id : '' + id;
      var specialTags = '', normalTags = '';
      cats.forEach(function(cat) {
        var extra = '';
        if (cat.indexOf('高含金量') !== -1) extra = ' tag-legend';
        else if (cat.indexOf('史诗') !== -1) extra = ' tag-epic';
        else if (cat.indexOf('稀有') !== -1) extra = ' tag-rare';
        else if (cat.indexOf('熬夜') !== -1) extra = ' tag-night';
        else if (cat.indexOf('较水') !== -1) extra = ' tag-done';
        if (extra !== '') {
          specialTags += '<span class="tag-cat' + extra + '">' + cat + '</span>';
        } else {
          normalTags += '<span class="tag-cat">' + cat + '</span>';
        }
      });
      html +=
        '<div class="card" data-id="' + id + '" data-cls="' + cls + '" data-level="' + level + '" tabindex="0">' +
          '<div class="card-top">' +
            '<span class="card-num">' + numStr + '</span>' +
            '<span class="card-name">' + name + '</span>' +
          '</div>' +
          '<div class="card-tags">' +
            '<span class="tag-a">' + cls + '</span>' +
            '<span class="tag-level">' + level + '</span>' +
            specialTags +
          '</div>' +
          (normalTags !== '' ? '<div class="card-tags">' + normalTags + '</div>' : '') +
          '<div class="card-bars">' +
            '<div class="card-bar-row">' +
              '<span class="card-bar-label">难度</span>' +
              '<div class="card-bar-wrap"><div class="card-bar-fill" style="width:' + (diff * 10) + '%"></div></div>' +
              '<span class="card-bar-val">' + diff + '</span>' +
            '</div>' +
            '<div class="card-bar-row">' +
              '<span class="card-bar-label">热度</span>' +
              '<div class="card-bar-wrap"><div class="card-bar-fill" style="width:' + (heat * 10) + '%"></div></div>' +
              '<span class="card-bar-val">' + heat + '</span>' +
            '</div>' +
            '<div class="card-bar-row">' +
              '<span class="card-bar-label">卷度</span>' +
              '<div class="card-bar-wrap"><div class="card-bar-fill" style="width:' + (juan * 10) + '%"></div></div>' +
              '<span class="card-bar-val">' + juan + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    });

    grid.innerHTML = html;

    // 搜索 + 筛选
    var searchInput = document.getElementById('searchInput');
    var filterClass = document.getElementById('filterClass');
    var filterLevel = document.getElementById('filterLevel');

    function applyFilters() {
      var keyword = searchInput.value.trim().toLowerCase();
      var clsFilter = filterClass.value;
      var lvlFilter = filterLevel.value;
      var cards = grid.querySelectorAll('.card');
      var visible = 0;

      cards.forEach(function(card) {
        var name = card.querySelector('.card-name').textContent.toLowerCase();
        var catSpans = card.querySelectorAll('.tag-cat');
        var catText = '';
        catSpans.forEach(function(s) { catText += s.textContent.toLowerCase() + ' '; });

        var matchSearch = (keyword === '' || name.indexOf(keyword) !== -1 || catText.indexOf(keyword) !== -1);

        // cls 中包含对应字母即匹配
        var matchClass = true;
        if (clsFilter !== '') {
          var cardCls = card.getAttribute('data-cls');
          if (clsFilter === 'C') {
            matchClass = (cardCls.indexOf('A') === -1 && cardCls.indexOf('B') === -1);
          } else {
            matchClass = (cardCls.indexOf(clsFilter) !== -1);
          }
        }

        var matchLevel = (lvlFilter === '' || card.getAttribute('data-level') === lvlFilter);

        if (matchSearch && matchClass && matchLevel) {
          card.style.display = '';
          visible++;
        } else {
          card.style.display = 'none';
        }
      });

      var oldTip = grid.querySelector('.no-result');
      if (oldTip) oldTip.remove();
      if (visible === 0) {
        var tip = document.createElement('div');
        tip.className = 'no-result';
        tip.textContent = '未找到匹配的竞赛';
        grid.appendChild(tip);
      }
    }

    searchInput.addEventListener('input', applyFilters);
    filterClass.addEventListener('change', applyFilters);
    filterLevel.addEventListener('change', applyFilters);

    // 卡片点击：已有页面直接跳转，未创建则跳转 404
    grid.addEventListener('click', function(e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var id = parseInt(card.getAttribute('data-id'));
      if (existingPages.indexOf(id) !== -1) {
        window.location.href = id + '.html';
      } else {
        window.location.href = '404.html';
      }
    });
  </script>
</body>
</html>
